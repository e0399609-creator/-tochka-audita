<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Точка аудита</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7fb;
  color:#172033;
}

button,input,select,textarea{font:inherit}

button{
  cursor:pointer;
  border:0;
}

.top{
  background:#111827;
  color:white;
  padding:22px 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.top-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logo small{
  display:block;
  font-size:12px;
  font-weight:400;
  opacity:.7;
  margin-top:3px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:22px 16px 60px;
}

.page{display:none}
.page.active{display:block}

h1{
  margin:0 0 8px;
  font-size:30px;
}

h2{
  margin:0 0 16px;
  font-size:22px;
}

.subtitle{
  color:#64748b;
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:18px;
}

.stat b{
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

.stat span{
  color:#64748b;
  font-size:13px;
}

.card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(15,23,42,.04);
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:700;
  color:#475569;
}

input,select,textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:13px;
  background:white;
  color:#172033;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.btn{
  padding:12px 17px;
  border-radius:12px;
  font-weight:700;
}

.primary{
  background:#2563eb;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.dark{
  background:#111827;
  color:white;
}

.light{
  background:#e2e8f0;
  color:#172033;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.back{
  background:transparent;
  color:#2563eb;
  padding:5px 0 15px;
  font-weight:700;
}

.audit{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.audit-main{
  min-width:0;
}

.audit-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:6px;
}

.meta{
  color:#64748b;
  font-size:13px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:#e2e8f0;
  color:#334155;
}

.badge.work{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge.done{
  background:#dcfce7;
  color:#15803d;
}

.audit-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:35px 15px;
}

.workspace-header{
  background:#111827;
  color:white;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
}

.workspace-header h1{
  font-size:27px;
}

.workspace-header .meta{
  color:#cbd5e1;
}

.modules{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.module{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:17px;
  text-align:left;
  font-weight:800;
}

.module span{
  display:block;
  font-size:12px;
  color:#64748b;
  font-weight:500;
  margin-top:5px;
}

.module.active{
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.1);
}

.check{
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:16px;
  margin-bottom:10px;
  background:white;
}

.check-title{
  font-weight:700;
  margin-bottom:10px;
}

.check-buttons{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.check-buttons button{
  padding:8px 12px;
  border-radius:9px;
  background:#f1f5f9;
  color:#334155;
  font-size:13px;
}

.check-buttons button.selected{
  background:#2563eb;
  color:white;
}

.finding{
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:15px;
  margin-bottom:10px;
}

.finding.high{
  border-left:5px solid #dc2626;
}

.finding.medium{
  border-left:5px solid #f59e0b;
}

.finding.low{
  border-left:5px solid #16a34a;
}

.notice{
  padding:13px 15px;
  background:#eff6ff;
  border-radius:12px;
  color:#1d4ed8;
  margin-bottom:15px;
  font-size:14px;
}

.search{
  margin-bottom:15px;
}

.report-box{
  line-height:1.7;
}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .modules{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .container{padding:18px 12px 50px}
  h1{font-size:25px}
  .form{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .grid{grid-template-columns:repeat(2,1fr)}
  .modules{grid-template-columns:repeat(2,1fr)}
  .audit{align-items:flex-start;flex-direction:column}
  .audit-buttons{width:100%}
  .audit-buttons .btn{flex:1}
  .top{padding:16px}
}
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">
    <div class="logo">
      Точка аудита
      <small>Управление аудиторскими проверками</small>
    </div>
  </div>
</header>

<main class="container">

<section id="homePage" class="page active">

  <h1>Мои аудиты</h1>
  <div class="subtitle">
    Создавайте проверки и проводите их от начала до отчёта.
  </div>

  <div class="grid">
    <div class="stat">
      <b id="statAll">0</b>
      <span>Всего аудитов</span>
    </div>
    <div class="stat">
      <b id="statPlanned">0</b>
      <span>Запланировано</span>
    </div>
    <div class="stat">
      <b id="statWork">0</b>
      <span>В работе</span>
    </div>
    <div class="stat">
      <b id="statDone">0</b>
      <span>Завершено</span>
    </div>
  </div>

  <div class="card">
    <h2>Новый аудит</h2>

    <form id="auditForm">

      <div class="form">

        <div class="field">
          <label>Организация *</label>
          <input id="client" required placeholder="Например: ООО Альфа">
        </div>

        <div class="field">
          <label>Вид аудита *</label>
          <select id="type" required>
            <option value="Охрана труда">Охрана труда</option>
            <option value="Промышленная безопасность">Промышленная безопасность</option>
            <option value="Экология">Экология</option>
            <option value="ISO">ISO</option>
            <option value="Пожарная безопасность">Пожарная безопасность</option>
            <option value="Охрана окружающей среды">Охрана окружающей среды</option>
            <option value="HACCP">HACCP</option>
            <option value="Комплексный аудит">Комплексный аудит</option>
          </select>
        </div>

        <div class="field">
          <label>Дата аудита *</label>
          <input id="date" type="date" required>
        </div>

        <div class="field">
          <label>Ответственный аудитор</label>
          <input id="auditor" placeholder="ФИО аудитора">
        </div>

        <div class="field full">
          <label>Примечание</label>
          <textarea id="description" placeholder="Дополнительная информация по проверке"></textarea>
        </div>

      </div>

      <div class="actions">
        <button class="btn primary" type="submit">
          ＋ Создать аудит
        </button>
      </div>

    </form>
  </div>

  <div class="card">
    <h2>Список аудитов</h2>

    <input
      class="search"
      id="search"
      placeholder="Поиск по организации или виду аудита..."
    >

    <div id="auditList"></div>
  </div>

</section>


<section id="detailPage" class="page">

  <button class="back" onclick="showHome()">
    ← Назад к моим аудитам
  </button>

  <div id="detailContent"></div>

</section>


<section id="workspacePage" class="page">

  <button class="back" onclick="openDetail(currentAuditId)">
    ← Назад к аудиту
  </button>

  <div id="workspaceContent"></div>

</section>

</main>


<script>

const STORAGE_KEY = "tochka_audita_final_v1";

let audits = [];
let currentAuditId = null;
let currentModule = "checklist";


function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}


function today(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}


function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}


function saveAudits(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(audits));
    return true;
  }catch(error){
    alert(
      "Не удалось сохранить данные в браузере. " +
      "Попробуйте открыть приложение в Safari."
    );
    return false;
  }
}


function loadAudits(){

  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(raw){
      audits = JSON.parse(raw);
    }

    if(!Array.isArray(audits)){
      audits = [];
    }

  }catch(error){
    audits = [];
  }

  audits = audits.map(a => normalizeAudit(a));
}


function normalizeAudit(a){

  return {
    id: a.id || uid(),
    client: a.client || "",
    type: a.type || "Комплексный аудит",
    date: a.date || today(),
    auditor: a.auditor || "",
    description: a.description || "",
    status: a.status || "planned",
    createdAt: a.createdAt || new Date().toISOString(),

    checklist: Array.isArray(a.checklist)
      ? a.checklist
      : createChecklist(a.type),

    findings: Array.isArray(a.findings)
      ? a.findings
      : [],

    documents: Array.isArray(a.documents)
      ? a.documents
      : [],

    notes: a.notes || "",

    risks: Array.isArray(a.risks)
      ? a.risks
      : []
  };
}


function createChecklist(type){

  const common = [
    "Есть действующие локальные нормативные документы",
    "Назначены ответственные лица",
    "Проводятся необходимые инструктажи",
    "Ведутся журналы и записи",
    "Сотрудники ознакомлены с требованиями",
    "Документы и записи доступны для проверки"
  ];

  const specific = {

    "Охрана труда":[
      "Проведена оценка профессиональных рисков",
      "Работники обеспечены СИЗ",
      "Проводятся обязательные обучения и проверки знаний",
      "Проводятся медицинские осмотры при необходимости",
      "Расследование несчастных случаев организовано"
    ],

    "Промышленная безопасность":[
      "Опасные производственные объекты идентифицированы",
      "Проводится производственный контроль",
      "Оборудование проходит необходимые освидетельствования",
      "Ответственные лица назначены",
      "Документация по промышленной безопасности ведётся"
    ],

    "Экология":[
      "Ведётся экологическая документация",
      "Есть необходимые разрешительные документы",
      "Организован учёт отходов",
      "Отходы передаются уполномоченным организациям",
      "Контролируются экологические показатели"
    ],

    "ISO":[
      "Определены процессы системы менеджмента",
      "Определены риски и возможности",
      "Ведётся управление документированной информацией",
      "Проводится внутренний аудит",
      "Организован анализ со стороны руководства"
    ],

    "Пожарная безопасность":[
      "Есть документы по пожарной безопасности",
      "Проводятся инструктажи",
      "Средства пожаротушения обслуживаются",
      "Эвакуационные пути свободны",
      "Системы пожарной защиты обслуживаются"
    ],

    "HACCP":[
      "Определены критические контрольные точки",
      "Проводится контроль критических параметров",
      "Ведутся записи контроля",
      "Контролируются санитарные требования",
      "Есть процедуры корректирующих действий"
    ]

  };

  return [...common,...(specific[type] || [
    "Проверены применимые нормативные требования",
    "Проверены основные процессы организации",
    "Проверены документы и фактическое состояние"
  ])].map((title,i)=>({
    id:"c"+i,
    title,
    result:""
  }));
}


function statusText(status){

  if(status==="work") return "В работе";
  if(status==="done") return "Завершён";
  return "Запланировано";
}


function statusClass(status){
  if(status==="work") return "work";
  if(status==="done") return "done";
  return "";
}


function updateStats(){

  document.getElementById("statAll").textContent = audits.length;

  document.getElementById("statPlanned").textContent =
    audits.filter(a=>a.status==="planned").length;

  document.getElementById("statWork").textContent =
    audits.filter(a=>a.status==="work").length;

  document.getElementById("statDone").textContent =
    audits.filter(a=>a.status==="done").length;
}


function renderAudits(){

  const box = document.getElementById("auditList");
  const query =
    document.getElementById("search").value
      .trim()
      .toLowerCase();

  const list = audits.filter(a =>
    a.client.toLowerCase().includes(query) ||
    a.type.toLowerCase().includes(query)
  );

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        Пока аудитов нет.<br>
        Создайте первую проверку выше.
      </div>
    `;

    return;
  }

  box.innerHTML = list.map(a => `

    <div class="card">

      <div class="audit">

        <div class="audit-main">

          <div class="audit-title">
            ${escapeHtml(a.client)}
          </div>

          <div class="meta">
            ${escapeHtml(a.type)}<br>
            Дата: ${escapeHtml(a.date)}
            ${a.auditor
              ? "<br>Аудитор: "+escapeHtml(a.auditor)
              : ""
            }
          </div>

          <br>

          <span class="badge ${statusClass(a.status)}">
            ${statusText(a.status)}
          </span>

        </div>

        <div class="audit-buttons">

          <button
            class="btn primary"
            onclick="openDetail('${a.id}')">
            Открыть
          </button>

          <button
            class="btn danger"
            onclick="deleteAudit('${a.id}')">
            Удалить
          </button>

        </div>

      </div>

    </div>

  `).join("");
}


document.getElementById("auditForm")
.addEventListener("submit",function(event){

  event.preventDefault();

  const audit = normalizeAudit({

    id:uid(),

    client:
      document.getElementById("client").value.trim(),

    type:
      document.getElementById("type").value,

    date:
      document.getElementById("date").value,

    auditor:
      document.getElementById("auditor").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    status:"planned",

    createdAt:new Date().toISOString()

  });

  audits.unshift(audit);

  if(!saveAudits()){
    audits.shift();
    return;
  }

  document.getElementById("auditForm").reset();

  document.getElementById("date").value = today();

  renderAudits();
  updateStats();

  alert(
    "✓ Аудит «" +
    audit.client +
    "» сохранён.\n\n" +
    "Теперь нажмите «Открыть» и затем «НАЧАТЬ АУДИТ»."
  );

  openDetail(audit.id);
});


document.getElementById("search")
.addEventListener("input",renderAudits);


function showPage(id){

  document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}


function showHome(){
  showPage("homePage");
  renderAudits();
  updateStats();
}


function findAudit(id){
  return audits.find(a=>a.id===id);
}


function openDetail(id){

  const audit = findAudit(id);

  if(!audit){
    alert("Аудит не найден.");
    return;
  }

  currentAuditId = id;

  document.getElementById("detailContent").innerHTML = `

    <div class="workspace-header">

      <h1>${escapeHtml(audit.client)}</h1>

      <div class="meta">
        ${escapeHtml(audit.type)} · ${escapeHtml(audit.date)}
        <br>
        Статус:
        <strong>${statusText(audit.status)}</strong>
      </div>

      <div class="actions">

        ${
          audit.status !== "done"
          ? `
            <button
              class="btn success"
              onclick="startAudit('${audit.id}')">
              ▶ НАЧАТЬ АУДИТ
            </button>
          `
          : ""
        }

        <button
          class="btn light"
          onclick="deleteAudit('${audit.id}')">
          Удалить аудит
        </button>

      </div>

    </div>

    <div class="card">

      <h2>Карточка проверки</h2>

      <div class="meta">

        <strong>Организация:</strong>
        ${escapeHtml(audit.client)}
        <br><br>

        <strong>Вид:</strong>
        ${escapeHtml(audit.type)}
        <br><br>

        <strong>Дата:</strong>
        ${escapeHtml(audit.date)}
        <br><br>

        ${
          audit.auditor
          ? `
            <strong>Аудитор:</strong>
            ${escapeHtml(audit.auditor)}
            <br><br>
          `
          : ""
        }

        ${
          audit.description
          ? `
            <strong>Примечание:</strong>
            ${escapeHtml(audit.description)}
          `
          : ""
        }

      </div>

    </div>

    <div class="card">

      <h2>Как проходит аудит</h2>

      <div class="meta">

        1. Начать аудит<br>
        2. Проверять пункты чек-листа<br>
        3. Фиксировать документы и доказательства<br>
        4. Добавлять нарушения<br>
        5. Оценивать риски<br>
        6. Формировать рекомендации<br>
        7. Сформировать отчёт<br>
        8. Завершить аудит

      </div>

    </div>

  `;

  showPage("detailPage");
}


function startAudit(id){

  const audit = findAudit(id);

  if(!audit) return;

  audit.status = "work";

  saveAudits();

  currentAuditId = id;

  currentModule = "checklist";

  openWorkspace(id);
}


function openWorkspace(id){

  const audit = findAudit(id);

  if(!audit) return;

  currentAuditId = id;

  audit.status = audit.status==="done"
    ? "done"
    : "work";

  saveAudits();

  renderWorkspace();

  showPage("workspacePage");
}


function moduleButton(key,title,subtitle){

  return `
    <button
      class="module ${currentModule===key?"active":""}"
      onclick="setModule('${key}')">

      ${title}
      <span>${subtitle}</span>

    </button>
  `;
}


function renderWorkspace(){

  const audit = findAudit(currentAuditId);

  if(!audit) return;

  let content = "";

  if(currentModule==="checklist"){
    content = renderChecklist(audit);
  }

  if(currentModule==="documents"){
    content = renderDocuments(audit);
  }

  if(currentModule==="findings"){
    content = renderFindings(audit);
  }

  if(currentModule==="risks"){
    content = renderRisks(audit);
  }

  if(currentModule==="notes"){
    content = renderNotes(audit);
  }

  if(currentModule==="ai"){
    content = renderAI(audit);
  }

  if(currentModule==="report"){
    content = renderReport(audit);
  }

  document.getElementById("workspaceContent").innerHTML = `

    <div class="workspace-header">

      <h1>${escapeHtml(audit.client)}</h1>

      <div class="meta">
        ${escapeHtml(audit.type)}
        · ${escapeHtml(audit.date)}
        · ${statusText(audit.status)}
      </div>

    </div>

    <div class="modules">

      ${moduleButton(
        "checklist",
        "☑ Чек-лист",
        "Проверка требований"
      )}

      ${moduleButton(
        "documents",
        "▣ Документы",
        "Доказательства"
      )}

      ${moduleButton(
        "findings",
        "⚠ Нарушения",
        "Фиксация несоответствий"
      )}

      ${moduleButton(
        "risks",
        "◈ Риски",
        "Оценка риска"
      )}

      ${moduleButton(
        "notes",
        "✎ Заметки",
        "Записи аудитора"
      )}

      ${moduleButton(
        "ai",
        "✦ AI-анализ",
        "Предварительный анализ"
      )}

      ${moduleButton(
        "report",
        "▤ Отчёт",
        "Итог проверки"
      )}

    </div>

    <div class="card">
      ${content}
    </div>

  `;
}


function setModule(module){

  currentModule = module;

  renderWorkspace();

}


function renderChecklist(audit){

  const total = audit.checklist.length;

  const answered =
    audit.checklist.filter(x=>x.result).length;

  const good =
    audit.checklist.filter(x=>x.result==="ok").length;

  return `

    <h2>Чек-лист аудита</h2>

    <div class="notice">
      Проверено: ${answered} из ${total}.
      Соответствует: ${good}.
    </div>

    ${audit.checklist.map((item,index)=>`

      <div class="check">

        <div class="check-title">
          ${index+1}. ${escapeHtml(item.title)}
        </div>

        <div class="check-buttons">

          <button
            class="${item.result==="ok"?"selected":""}"
            onclick="setCheck('${item.id}','ok')">
            ✓ Соответствует
          </button>

          <button
            class="${item.result==="partial"?"selected":""}"
            onclick="setCheck('${item.id}','partial')">
            ◐ Частично
          </button>

          <button
            class="${item.result==="bad"?"selected":""}"
            onclick="setCheck('${item.id}','bad')">
            ✕ Не соответствует
          </button>

          <button
            class="${item.result==="na"?"selected":""}"
            onclick="setCheck('${item.id}','na')">
            — Н/П
          </button>

        </div>

      </div>

    `).join("")}

    <div class="actions">

      <button
        class="btn success"
        onclick="finishAudit('${audit.id}')">
        ✓ Завершить аудит
      </button>

    </div>

  `;
}


function setCheck(itemId,result){

  const audit = findAudit(currentAuditId);

  if(!audit) return;

  const item = audit.checklist.find(x=>x.id===itemId);

  if(item){
    item.result=result;
  }

  saveAudits();

  renderWorkspace();
}


function renderDocuments(audit){

  return `

    <h2>Документы и доказательства</h2>

    <div class="notice">
      Здесь фиксируем документы, которые были запрошены
      и проверены в ходе аудита.
    </div>

    <div class="field">

      <label>Название документа</label>

      <input
        id="documentName"
        placeholder="Например: Инструкция по охране труда">

    </div>

    <div class="actions">

      <button
        class="btn primary"
        onclick="addDocument()">
        ＋ Добавить документ
      </button>

    </div>

    <br>

    ${
      audit.documents.length
      ?
      audit.documents.map((doc,index)=>`

        <div class="finding">

          <strong>
            ${escapeHtml(doc)}
          </strong>

          <div class="actions">

            <button
              class="btn danger"
              onclick="removeDocument(${index})">
              Удалить
            </button>

          </div>

        </div>

      `).join("")
      :
      `<div class="empty">Документы пока не добавлены.</div>`
    }

  `;
}


function addDocument(){

  const input=document.getElementById("documentName");

  const value=input.value.trim();

  if(!value){
    alert("Введите название документа.");
    return;
  }

  const audit=findAudit(currentAuditId);

  audit.documents.push(value);

  saveAudits();

  renderWorkspace();
}


function removeDocument(index){

  const audit=findAudit(currentAuditId);

  audit.documents.splice(index,1);

  saveAudits();

  renderWorkspace();
}


function renderFindings(audit){

  return `

    <h2>Нарушения и несоответствия</h2>

    <div class="form">

      <div class="field full">

        <label>Описание нарушения *</label>

        <textarea
          id="findingText"
          placeholder="Что именно обнаружено?"></textarea>

      </div>

      <div class="field">

        <label>Серьёзность</label>

        <select id="findingSeverity">

          <option value="high">Высокая</option>
          <option value="medium">Средняя</option>
          <option value="low">Низкая</option>

        </select>

      </div>

      <div class="field">

        <label>Доказательство</label>

        <input
          id="findingEvidence"
          placeholder="Документ, фото, наблюдение...">

      </div>

    </div>

    <div class="actions">

      <button
        class="btn primary"
        onclick="addFinding()">
        ＋ Зафиксировать нарушение
      </button>

    </div>

    <br>

    ${
      audit.findings.length
      ?
      audit.findings.map((f,index)=>`

        <div class="finding ${f.severity}">

          <strong>
            ${escapeHtml(f.text)}
          </strong>

          <p class="meta">
            Серьёзность:
            ${severityText(f.severity)}
            <br>
            Доказательство:
            ${escapeHtml(f.evidence || "Не указано")}
          </p>

          <button
            class="btn danger"
            onclick="removeFinding(${index})">
            Удалить
          </button>

        </div>

      `).join("")
      :
      `<div class="empty">Нарушений пока не зафиксировано.</div>`
    }

  `;
}


function severityText(s){

  if(s==="high") return "Высокая";
  if(s==="medium") return "Средняя";
  return "Низкая";
}


function addFinding(){

  const text=
    document.getElementById("findingText").value.trim();

  if(!text){
    alert("Опишите нарушение.");
    return;
  }

  const audit=findAudit(currentAuditId);

  audit.findings.push({

    id:uid(),

    text,

    severity:
      document.getElementById("findingSeverity").value,

    evidence:
      document.getElementById("findingEvidence").value.trim()

  });

  saveAudits();

  renderWorkspace();
}


function removeFinding(index){

  const audit=findAudit(currentAuditId);

  audit.findings.splice(index,1);

  saveAudits();

  renderWorkspace();
}


function renderRisks(audit){

  const high =
    audit.findings.filter(x=>x.severity==="high").length;

  const medium =
    audit.findings.filter(x=>x.severity==="medium").length;

  const low =
    audit.findings.filter(x=>x.severity==="low").length;

  return `

    <h2>Риски</h2>

    <div class="grid">

      <div class="stat">
        <b>${high}</b>
        <span>Высокий риск</span>
      </div>

      <div class="stat">
        <b>${medium}</b>
        <span>Средний риск</span>
      </div>

      <div class="stat">
        <b>${low}</b>
        <span>Низкий риск</span>
      </div>

      <div class="stat">
        <b>${audit.findings.length}</b>
        <span>Всего нарушений</span>
      </div>

    </div>

    <div class="notice">
      На первом этапе риск рассчитывается по серьёзности
      выявленного нарушения. В дальнейшем подключим
      полноценную матрицу вероятность × последствия.
    </div>

    ${
      audit.findings.length
      ?
      audit.findings.map(f=>`

        <div class="finding ${f.severity}">

          <strong>
            ${severityText(f.severity)} риск
          </strong>

          <p>
            ${escapeHtml(f.text)}
          </p>

        </div>

      `).join("")
      :
      `<div class="empty">
        Нарушений нет — риски пока не сформированы.
      </div>`
    }

  `;
}


function renderNotes(audit){

  return `

    <h2>Заметки аудитора</h2>

    <textarea
      id="notesArea"
      placeholder="Записывайте наблюдения прямо во время проверки..."
    >${escapeHtml(audit.notes)}</textarea>

    <div class="actions">

      <button
        class="btn primary"
        onclick="saveNotes()">
        Сохранить заметки
      </button>

    </div>

    <div class="notice">
      Голосовые заметки и автоматическую расшифровку
      подключим следующим этапом.
    </div>

  `;
}


function saveNotes(){

  const audit=findAudit(currentAuditId);

  audit.notes=
    document.getElementById("notesArea").value;

  saveAudits();

  alert("✓ Заметки сохранены.");

  renderWorkspace();
}


function renderAI(audit){

  const bad =
    audit.checklist.filter(x=>x.result==="bad").length;

  const partial =
    audit.checklist.filter(x=>x.result==="partial").length;

  const findings =
    audit.findings.length;

  let level="Низкий";

  if(findings>0 || bad>0) level="Высокий";
  else if(partial>0) level="Средний";

  return `

    <h2>Предварительный AI-анализ</h2>

    <div class="notice">

      Текущий уровень внимания:
      <strong>${level}</strong>

    </div>

    <div class="report-box">

      <p>
        <strong>Результаты чек-листа:</strong>
        ${bad} пунктов не соответствуют,
        ${partial} частично соответствуют.
      </p>

      <p>
        <strong>Выявлено нарушений:</strong>
        ${findings}.
      </p>

      <p>
        <strong>Предварительная рекомендация:</strong>
        ${
          level==="Высокий"
          ? "в первую очередь устранить критичные несоответствия и определить ответственных за корректирующие действия."
          : level==="Средний"
          ? "сформировать план корректирующих мероприятий и установить сроки."
          : "сохранить текущий уровень контроля и проверить полноту доказательств."
        }
      </p>

    </div>

    <div class="notice">
      Это пока встроенный предварительный анализ.
      Следующим этапом подключим настоящую AI-модель,
      нормативную базу и автоматическое формирование рекомендаций.
    </div>

  `;
}


function renderReport(audit){

  const answered=
    audit.checklist.filter(x=>x.result).length;

  const good=
    audit.checklist.filter(x=>x.result==="ok").length;

  const bad=
    audit.checklist.filter(x=>x.result==="bad").length;

  return `

    <h2>Итоговый отчёт</h2>

    <div class="report-box">

      <h3>Аудит: ${escapeHtml(audit.client)}</h3>

      <p>
        <strong>Вид:</strong>
        ${escapeHtml(audit.type)}
      </p>

      <p>
        <strong>Дата:</strong>
        ${escapeHtml(audit.date)}
      </p>

      <hr>

      <p>
        <strong>Проверено пунктов:</strong>
        ${answered} из ${audit.checklist.length}
      </p>

      <p>
        <strong>Соответствует:</strong>
        ${good}
      </p>

      <p>
        <strong>Не соответствует:</strong>
        ${bad}
      </p>

      <p>
        <strong>Выявлено нарушений:</strong>
        ${audit.findings.length}
      </p>

      <p>
        <strong>Проверено документов:</strong>
        ${audit.documents.length}
      </p>

      <hr>

      <h3>Нарушения</h3>

      ${
        audit.findings.length
        ?
        audit.findings.map((f,i)=>`

          <p>
            <strong>${i+1}. ${severityText(f.severity)}</strong><br>
            ${escapeHtml(f.text)}
          </p>

        `).join("")
        :
        "<p>Нарушения не зафиксированы.</p>"
      }

      <h3>Заметки</h3>

      <p>
        ${escapeHtml(audit.notes || "Нет заметок.")}
      </p>

    </div>

    <div class="actions">

      <button
        class="btn dark"
        onclick="printReport()">
        🖨 Печать / PDF
      </button>

      ${
        audit.status!=="done"
        ?
        `
        <button
          class="btn success"
          onclick="finishAudit('${audit.id}')">
          ✓ Завершить аудит
        </button>
        `
        :
        ""
      }

    </div>

  `;
}


function printReport(){

  window.print();

}


function finishAudit(id){

  const audit=findAudit(id);

  if(!audit) return;

  if(!confirm(
    "Завершить аудит?\n\n" +
    "После завершения его можно будет просматривать и при необходимости продолжить."
  )){
    return;
  }

  audit.status="done";

  saveAudits();

  alert("✓ Аудит завершён.");

  renderWorkspace();

}


function deleteAudit(id){

  const audit=findAudit(id);

  if(!audit) return;

  if(!confirm(
    "Удалить аудит «"+
    audit.client+
    "»?\n\nЭто действие нельзя отменить."
  )){
    return;
  }

  audits=audits.filter(a=>a.id!==id);

  saveAudits();

  showHome();

}


document.getElementById("date").value=today();

loadAudits();

updateStats();

renderAudits();

</script>

</body>
</html>
